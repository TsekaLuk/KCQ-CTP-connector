# 用途：固定 CTP connector 的 Python、原生绑定及服务依赖。
[project]
name = "kcq-ctp-connector"
version = "0.1.0"
description = "Read-only CTP connection diagnostics and snapshot recording for KCQ"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115,<1",
  "openctp-ctp==6.7.7.1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
tts = ["openctp-ctp-channels==0.2.0", "pip>=25,<27"]

[dependency-groups]
dev = ["httpx>=0.27,<1"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
